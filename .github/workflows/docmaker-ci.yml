name: MATLAB DocMaker Actions

on:
  push:
    branches: [master, cmark_multiplatform]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:

  run-tests:
    needs: build-windows-mex
    strategy:
      matrix:
        matlab-version: [R2022b, R2023b, R2024b, R2025b, R2026a, R2026b]
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Windows MEX
        uses: actions/download-artifact@v4
        with:
          name: windows-mex
          path: artifacts/windows

      - name: Stage Windows MEX
        shell: pwsh
        run: Copy-Item -LiteralPath artifacts/windows/cmarkgfm2html.mexw64 -Destination tbx/docmaker/+docmaker/

      - name: Set up MATLAB on the runner
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: ${{ matrix.matlab-version }}

      - name: Test toolbox with R2026b MEX
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            openProject(pwd);
            addpath(fullfile(pwd,'tbx','docmaker'));
            addpath(fullfile(pwd,'tbx','docmakerdoc'));
            addpath(fullfile(pwd,'tests'));
            results = runtests(fullfile(pwd,'tests'));
            assert(~isempty(results) && all([results.Passed]))

  build-windows-mex:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MATLAB on the runner
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: R2026b

      - name: Show MEX compiler
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup cpp

      - name: Check project
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('check')

      - name: Build Windows MEX
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('mex'); assert(isfile(fullfile(pwd,'tbx','docmaker','+docmaker','cmarkgfm2html.mexw64')))

      - name: Upload Windows MEX
        uses: actions/upload-artifact@v4
        with:
          name: windows-mex
          path: tbx/docmaker/+docmaker/cmarkgfm2html.mexw64
          if-no-files-found: error

  build-macos-mex:
    runs-on: macos-15-intel
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MATLAB on the runner
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: R2024b

      - name: Show MEX compiler
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup cpp

      - name: Check project
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('check')

      - name: Build and test Intel macOS MEX
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('mex'); buildtool test -skip mex -skip check; assert(isfile(fullfile(pwd,'tbx','docmaker','+docmaker','cmarkgfm2html.mexmaci64')))

      - name: Upload macOS MEX
        uses: actions/upload-artifact@v4
        with:
          name: macos-mex
          path: tbx/docmaker/+docmaker/cmarkgfm2html.mexmaci64
          if-no-files-found: error

  build-macos-arm64-mex:
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify ARM64 runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up MATLAB on the runner
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: R2026b

      - name: Show MEX compiler
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup cpp

      - name: Check project
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('check')

      - name: Build and test Apple Silicon MEX
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            assert(strcmp(mexext(),'mexmaca64'));
            openProject(pwd);
            buildtool('mex');
            buildtool test -skip mex -skip check;
            assert(isfile(fullfile(pwd,'tbx','docmaker','+docmaker','cmarkgfm2html.mexmaca64')));
            html = string(docmaker.cmarkgfm2html('# Apple Silicon'));
            assert(contains(html,'Apple Silicon'))

      - name: Upload Apple Silicon MEX
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-mex
          path: tbx/docmaker/+docmaker/cmarkgfm2html.mexmaca64
          if-no-files-found: error

  package-and-release-toolbox:
    needs: [run-tests, build-windows-mex, build-macos-mex, build-macos-arm64-mex]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Windows MEX
        uses: actions/download-artifact@v4
        with:
          name: windows-mex
          path: artifacts/windows

      - name: Download macOS MEX
        uses: actions/download-artifact@v4
        with:
          name: macos-mex
          path: artifacts/macos

      - name: Download Apple Silicon MEX
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-mex
          path: artifacts/macos-arm64

      - name: Stage platform MEX files
        shell: bash
        run: |
          cp artifacts/windows/cmarkgfm2html.mexw64 tbx/docmaker/+docmaker/
          cp artifacts/macos/cmarkgfm2html.mexmaci64 tbx/docmaker/+docmaker/
          cp artifacts/macos-arm64/cmarkgfm2html.mexmaca64 tbx/docmaker/+docmaker/

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TOOLBOX_VERSION=$version`n", [Text.UTF8Encoding]::new($false))

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $lines = Get-Content tbx/docmakerdoc/changelog.md
          $heading = "## Version $env:TOOLBOX_VERSION"
          $start = [Array]::IndexOf($lines, $heading)
          if ($start -lt 0) { throw "Release notes for $env:TOOLBOX_VERSION were not found." }
          $end = $start + 1
          while ($end -lt $lines.Length -and -not $lines[$end].StartsWith('## ')) { $end++ }
          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          $content = "RELEASE_NOTES<<$delimiter`n$notes`n$delimiter`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $content, [Text.UTF8Encoding]::new($false))

      - name: Set up MATLAB on the runner
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: R2026b

      - name: Show MEX compiler
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup cpp

      - name: Check project
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('check')

      - name: Build Linux MEX
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('mex'); assert(isfile(fullfile(pwd,'tbx','docmaker','+docmaker','cmarkgfm2html.mexa64')))

      - name: Test toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool test -skip mex -skip check

      - name: Build documentation
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool doc -skip mex

      - name: Build and package toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool package -skip check -skip mex -skip test -skip doc

      - name: Verify toolbox contains all platform MEX files
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            toolbox="releases/MATLAB_DocMaker.mltbx"
          else
            toolbox="$(find releases -maxdepth 1 -name 'MATLAB DocMaker *.mltbx' -print -quit)"
          fi
          test -n "$toolbox" && test -f "$toolbox"
          for mex in cmarkgfm2html.mexw64 cmarkgfm2html.mexa64 cmarkgfm2html.mexmaci64 cmarkgfm2html.mexmaca64; do
            if ! unzip -Z1 "$toolbox" | awk -F/ -v file="$mex" '$NF == file { found = 1 } END { exit !found }'; then
              echo "Missing $mex in $toolbox"
              exit 1
            fi
          done

      - name: Upload branch candidate toolbox
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc
          path: releases/*.mltbx
          if-no-files-found: error
          retention-days: 14

      - name: Release toolbox
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: MATLAB DocMaker ${{ env.TOOLBOX_VERSION }}
          tag_name: v${{ env.TOOLBOX_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          make_latest: true
          files: releases/MATLAB_DocMaker.mltbx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
