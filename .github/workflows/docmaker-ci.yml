name: MATLAB DocMaker Actions

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:

  run-tests:
    strategy:
      matrix:
        matlab-version: [R2022b, R2023b, R2024b, R2025b, R2026a, R2026b, latest-including-prerelease]
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MATLAB on the runner
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: ${{ matrix.matlab-version }}

      - name: Build and test toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('test')

  package-and-release-toolbox:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Extract version from tag
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.TrimStart('v')
        [IO.File]::AppendAllText($env:GITHUB_ENV, "TOOLBOX_VERSION=$version`n", [Text.UTF8Encoding]::new($false))

    - name: Extract release notes
      shell: pwsh
      run: |
        $lines = Get-Content tbx/docmakerdoc/changelog.md
        $heading = "## Version $env:TOOLBOX_VERSION"
        $start = [Array]::IndexOf($lines, $heading)
        if ($start -lt 0) { throw "Release notes for $env:TOOLBOX_VERSION were not found." }
        $end = $start + 1
        while ($end -lt $lines.Length -and -not $lines[$end].StartsWith('## ')) { $end++ }
        $notes = $lines[($start + 1)..($end - 1)] -join "`n"
        $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
        $content = "RELEASE_NOTES<<$delimiter`n$notes`n$delimiter`n"
        [IO.File]::AppendAllText($env:GITHUB_ENV, $content, [Text.UTF8Encoding]::new($false))

    - name: Set up MATLAB on the runner
      uses: matlab-actions/setup-matlab@v3
      with:
        products: MATLAB

    - name: Package toolbox
      uses: matlab-actions/run-command@v3
      with:
        command: buildtool package -skip test -skip check

        tasks: package
        build-options: -skip test -skip check

    - name: Release toolbox
      uses: softprops/action-gh-release@v3
      with:
        name: MATLAB DocMaker ${{ env.TOOLBOX_VERSION }}
        tag_name: v${{ env.TOOLBOX_VERSION }}
        body: ${{ env.RELEASE_NOTES }}
        draft: false
        make_latest: true
        files: releases/MATLAB_DocMaker.mltbx
      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}