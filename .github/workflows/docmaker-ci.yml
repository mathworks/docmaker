name: MATLAB DocMaker CI

on:
  push:
    branches: [master, cmark_multiplatform]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: CI workload to run for the selected ref
        required: true
        default: test-mini
        type: choice
        options:
          - test-mini
          - test-full
          - package

permissions:
  contents: read

jobs:
  test-linux-latest:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'test-mini') ||
        (github.event_name == 'pull_request' && github.base_ref != 'master') ||
        (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cmark_multiplatform'))
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: latest

      - name: Configure the C compiler
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup C

      - name: Run checks, build the Linux MEX, and test
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('test')

  test-platforms-releases:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'test-full') ||
        (github.event_name == 'pull_request' && github.base_ref == 'master')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            release: latest
            extension: mexa64
            architecture: skip
          - platform: windows
            runner: windows-latest
            release: latest
            extension: mexw64
            architecture: skip
          - platform: macos-intel
            runner: macos-15-intel
            release: R2025b
            extension: mexmaci64
            architecture: x86_64
          - platform: macos-arm64
            runner: macos-15
            release: latest
            extension: mexmaca64
            architecture: arm64
    uses: ./.github/workflows/build-mex.yml
    with:
      runner: ${{ matrix.runner }}
      release: ${{ matrix.release }}
      mex_extension: ${{ matrix.extension }}
      artifact_name: mex-${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      run_tests: true

  test-linux-releases:
    needs: test-platforms-releases
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' && inputs.mode == 'test-full') ||
        (github.event_name == 'pull_request' && github.base_ref == 'master')) &&
        needs.test-platforms-releases.result == 'success'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted Ubuntu 20.04 runners are unavailable; R2021a is best-effort on 22.04.
          - matlab-version: R2021a
            runner: ubuntu-22.04
          - matlab-version: R2022b
            runner: ubuntu-22.04
          - matlab-version: R2023b
            runner: ubuntu-22.04
          - matlab-version: R2024b
            runner: ubuntu-24.04
          - matlab-version: R2025b
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Download the Linux MEX built with the latest MATLAB
        uses: actions/download-artifact@v4
        with:
          name: mex-linux
          path: artifacts/linux

      - name: Stage the Linux MEX
        shell: bash
        run: cp artifacts/linux/cmarkgfm2html.mexa64 tbx/docmaker/+docmaker/

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: ${{ matrix.matlab-version }}

      - name: Run the compatibility suite
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            openProject(pwd);
            results = runtests('tests');
            assertSuccess(results)

  check-tag:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify the tag points to a commit on master
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          git fetch --no-tags origin master
          tag_commit="$(git rev-parse "${TAG_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "Release tag $TAG_REF does not point to a commit reachable from master."
            exit 1
          fi

  mex:
    needs: check-tag
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' && inputs.mode == 'package') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
        needs.check-tag.result == 'success'))
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            release: latest
            extension: mexw64
            architecture: skip
          - platform: macos-intel
            runner: macos-15-intel
            release: R2025b
            extension: mexmaci64
            architecture: x86_64
          - platform: macos-arm64
            runner: macos-15
            release: latest
            extension: mexmaca64
            architecture: arm64
    uses: ./.github/workflows/build-mex.yml
    with:
      runner: ${{ matrix.runner }}
      release: ${{ matrix.release }}
      mex_extension: ${{ matrix.extension }}
      artifact_name: mex-${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      run_tests: true

  package:
    needs: [check-tag, mex]
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' && inputs.mode == 'package') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
        needs.check-tag.result == 'success' &&
        needs.mex.result == 'success'))
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download the Windows and Mac MEX files
        uses: actions/download-artifact@v4
        with:
          pattern: mex-*
          path: artifacts/platforms
          merge-multiple: true

      - name: Stage the non-Linux MEX files
        shell: bash
        run: |
          cp artifacts/platforms/cmarkgfm2html.mexw64 tbx/docmaker/+docmaker/
          cp artifacts/platforms/cmarkgfm2html.mexmaci64 tbx/docmaker/+docmaker/
          cp artifacts/platforms/cmarkgfm2html.mexmaca64 tbx/docmaker/+docmaker/

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB
          release: latest

      - name: Configure the C compiler
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup C

      - name: Build and package the toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool('package')

      - name: Verify the package contains all platform MEX files
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            toolbox="releases/MATLAB_DocMaker.mltbx"
          else
            toolbox="$(find releases -maxdepth 1 -name '*.mltbx' -print -quit)"
          fi
          test -n "$toolbox" && test -f "$toolbox"
          for mex in cmarkgfm2html.mexw64 cmarkgfm2html.mexa64 cmarkgfm2html.mexmaca64 cmarkgfm2html.mexmaci64; do
            if ! unzip -Z1 "$toolbox" | awk -F/ -v file="$mex" '$NF == file { found = 1 } END { exit !found }'; then
              echo "Missing $mex in $toolbox"
              exit 1
            fi
          done

      - name: Upload the toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-package
          path: releases/*.mltbx
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [check-tag, package]
    if: >-
      ${{
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        needs.check-tag.result == 'success' &&
        needs.package.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Download the toolbox package
        uses: actions/download-artifact@v4
        with:
          name: toolbox-package
          path: release-assets

      - name: Extract the version from the tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TOOLBOX_VERSION=$version`n", [Text.UTF8Encoding]::new($false))

      - name: Extract release notes
        shell: pwsh
        run: |
          $lines = Get-Content tbx/docmakerdoc/changelog.md
          $heading = "## Version $env:TOOLBOX_VERSION"
          $start = [Array]::IndexOf($lines, $heading)
          if ($start -lt 0) { throw "Release notes for $env:TOOLBOX_VERSION were not found." }
          $end = $start + 1
          while ($end -lt $lines.Length -and -not $lines[$end].StartsWith('## ')) { $end++ }
          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          $content = "RELEASE_NOTES<<$delimiter`n$notes`n$delimiter`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $content, [Text.UTF8Encoding]::new($false))

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MATLAB DocMaker ${{ env.TOOLBOX_VERSION }}
          tag_name: ${{ github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          make_latest: true
          files: release-assets/MATLAB_DocMaker.mltbx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
